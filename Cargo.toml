[package]
name = "{{project-name}}"
version = "0.1.0"
authors = ["{{authors}}"]
edition = "2021"
build = "build.rs"

[dependencies]
slint = { version = "0.3.4", default-features = false, features = ["compat-0-3-0", "renderer-winit-software"] }

[build-dependencies]
slint-build = { version = "0.3.4" }

[patch.crates-io]
winit = { git = 'https://github.com/rust-windowing/winit' }

[features]
default = []
slint-default = ["slint/default"]